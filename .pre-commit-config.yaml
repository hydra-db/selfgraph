repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: typescript
        name: biome and tsc
        entry: bash -c 'npm --prefix typescript run lint && npm --prefix typescript run typecheck'
        language: system
        files: ^typescript/
        pass_filenames: false
